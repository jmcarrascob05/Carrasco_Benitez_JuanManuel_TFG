user www-data;
events {}

http {
    include mime.types;

    server {
        listen 80;
        root /var/www/rustyx;
        index index.php;

        # ^~ tiene prioridad sobre bloques regex (como \.jpg$)
        # Debe ir ANTES que el bloque de estáticos
        location ^~ /uploads/ {
            alias /var/www/uploads/;
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Archivos estáticos del proyecto (CSS, JS, imágenes del root)
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            try_files $uri =404;
            expires 7d;
        }

        # PHP
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Bloquear archivos sensibles
        location ~ ^/(config\.php|schema\.sql|debug_session\.php|debug_upload\.php|fix_relaciones\.sql|migracion\.sql) {
            deny all;
        }
        location ~ ^/partials/ {
            deny all;
        }
    }
}