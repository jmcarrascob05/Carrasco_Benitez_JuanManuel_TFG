# /etc/nginx/sites-available/rustyx.conf
# Copiar a ambos backends: web1 y web2

server {
    listen 80;
    server_name _;

    root /var/www/rustyx;
    index index.php;

    charset utf-8;
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/rustyx_access.log;
    error_log  /var/log/nginx/rustyx_error.log;

    # PHP via PHP-FPM
    location ~ \.php$ {
        fastcgi_pass  unix:/run/php/php8.2-fpm.sock;  # Ajustar versión de PHP
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    # Bloquear acceso a config.php y archivos sensibles
    location ~ ^/(config\.php|schema\.sql|\.git) {
        deny all;
        return 404;
    }

    # Bloquear acceso a partials directamente
    location ~ ^/partials/ {
        deny all;
        return 404;
    }

    # Archivos estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
